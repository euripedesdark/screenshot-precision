[package]
name = "samba-agent"
version = "0.1.0"
edition = "2021"
description = "Agente HTTP para administrar e provisionar Samba AD DC (e consultar qualquer AD via LDAP)"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
anyhow = "1"
